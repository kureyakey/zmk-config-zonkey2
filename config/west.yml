manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: inorichi
      url-base: https://github.com/inorichi
    - name: caksoylar
      url-base: https://github.com/caksoylar  
  projects:
    - name: zmk
      remote: cormoran          
      revision: v0.3-branch+dya
      import: app/west.yml
    - name: zmk-module-ble-management
      remote: cormoran
      revision: v0.3.0         # ← main から古いコア対応版に固定
    - name: zmk-module-battery-history
      remote: cormoran
      revision: v0.3.0         # ← main から古いコア対応版に固定
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: v0.3.0         # ← main から古いコア対応版に固定
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: v0.3.0         # ← これで zmk_keymap_layer_activate のエラーが消えます
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: v0.3.0         # ← main から古いコア対応版に固定
    - name: zmk-pmw3610-driver
      remote: inorichi
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
  self:
    path: config
